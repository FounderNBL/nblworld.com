name: NBL World University campus

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check campus and Social Chat JavaScript syntax
        run: |
          node --check university.js
          node --check chat.js
          node --check social-realtime.js
      - name: Check campus source boundaries
        run: node scripts/check-university-campus.mjs
      - name: Install Playwright
        run: npm install --no-save @playwright/test@latest
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve NBL World locally
        run: nohup python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/nblworld-http.log 2>&1 &
      - name: Browser smoke
        run: npx playwright test
